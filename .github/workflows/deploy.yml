name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history. The guard suite compares HEAD against HEAD~1 and walks
      # recent commits; a shallow clone makes those fail for a reason that has
      # nothing to do with what is being tested.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 matches the version the project is developed and verified
      # against locally; the lockfile is generated by its npm (11.x).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # No fallback to `npm install`. There used to be one, and it hid a real
      # lockfile drift for as long as this was the only deploy target: three
      # optional wasm packages needed @emnapi/runtime ^1.11.1 with no hoisted
      # entry in the lockfile to satisfy it. Every deploy quietly took the
      # fallback path, and the problem only surfaced when Cloudflare Pages ran
      # `npm clean-install` with nothing to catch it.
      #
      # A fallback that resolves fresh also defeats the point of a lockfile: it
      # can pull versions nobody reviewed, which is a supply-chain decision
      # being made silently by a CI step. Better that a drifted lockfile fails
      # here, loudly, where the fix is `npm install` and a commit.
      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # Project sites live at https://<user>.github.io/<repo>/, so the
          # build needs both halves to emit correct links and canonical URLs.
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Keep this copy out of search results. Since the move to Cloudflare
          # this workflow no longer publishes the site — it publishes a second
          # complete copy of it, and on 2026-08-04 both were live and indexable
          # at once. Worse, the SITE override above makes this copy canonicalise
          # to itself while Cloudflare's canonical points at swiftsecured.com,
          # which does not resolve yet: of the two, the address we do not want
          # customers to see was the only credible candidate for the index.
          #
          # The mirror is kept because it costs nothing and is somewhere to fall
          # back to if Cloudflare is misconfigured. It is not kept to be found.
          # Remove this line only if GitHub Pages becomes the real site again.
          NOINDEX_DEPLOY: "1"
          # Repository *variables*, not secrets: the PUBLIC_ prefix inlines
          # these into client-side JS, so they ship to every visitor anyway.
          # Marking them secret would only hide them from our own build logs.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
        run: npm run build

      # The second line of defence.
      #
      # .githooks/pre-push runs these before a push leaves a developer machine,
      # which is earlier and better. But a hook is opt-in: `git push
      # --no-verify` skips it, a fresh clone has none until `npm install` runs,
      # and on Linux git ignores one without the execute bit and says nothing.
      # Every one of those is silent, so something that cannot be skipped has to
      # run them too.
      #
      # This is the mirror build, not production — Cloudflare builds that. A
      # failure here does not stop the live site updating. It is here to be
      # noticed, and it is the only check in this repository that a person
      # cannot bypass by choosing to.
      - name: Type check
        run: npx astro check

      - name: Check what the built pages claim
        run: python3 scripts/test-site-claims.py

      # --fast starts no build of its own; it reuses the dist/ above and asserts
      # the things that can turn a guard off without touching its logic: the
      # hook's execute bit, the prepare script, the PATH fix, and that each of
      # the four checks is still wired into it.
      - name: Check the guards themselves still work
        run: python3 scripts/test-deploy-guards.py --fast

      - name: Warn if applications have nowhere to go
        if: vars.PUBLIC_CONTACT_EMAIL == ''
        run: echo "::warning::PUBLIC_CONTACT_EMAIL is unset — the apply form tells operators it could not submit and gives them no address to fall back to. Set it under Settings → Secrets and variables → Actions → Variables."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
